<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 일정 관리 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <!-- 로고 -->
                <div class="text-center mb-4">
                    <i class="bi bi-calendar-check text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2 text-primary">일정 관리 시스템</h3>
                    <p class="text-muted">효율적인 일정 관리를 시작하세요</p>
                </div>

                <!-- 로그인 카드 -->
                <div class="card border-0 shadow">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-bold mb-4 text-center">로그인</h5>

                        <!-- 성공 메시지 -->
                        <div th:if="${successMessage}" class="alert alert-success small" th:text="${successMessage}"></div>

                        <!-- 에러 메시지 -->
                        <div th:if="${param.error}" class="alert alert-danger small">
                            <i class="bi bi-exclamation-circle me-1"></i>
                            아이디 또는 비밀번호가 올바르지 않습니다.
                        </div>

                        <div th:if="${param.logout}" class="alert alert-info small">
                            <i class="bi bi-check-circle me-1"></i>
                            로그아웃 되었습니다.
                        </div>

                        <form th:action="@{/auth/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">아이디</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control"
                                           placeholder="아이디를 입력하세요" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">비밀번호</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control"
                                           placeholder="비밀번호를 입력하세요" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                            </button>
                        </form>

                        <!-- 데모 계정 안내 -->
                        <div class="mt-3 p-3 bg-light rounded small text-muted">
                            <i class="bi bi-info-circle me-1"></i>
                            <strong>데모 계정:</strong> demo / demo1234
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <span class="text-muted">계정이 없으신가요?</span>
                    <a th:href="@{/auth/register}" class="text-primary fw-semibold ms-1">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
