<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 일정 관리 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- 로고 -->
                <div class="text-center mb-4">
                    <i class="bi bi-calendar-check text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2 text-primary">회원가입</h3>
                    <p class="text-muted">새 계정을 만드세요</p>
                </div>

                <div class="card border-0 shadow">
                    <div class="card-body p-4">

                        <form th:action="@{/auth/register}" th:object="${userDto}" method="post" novalidate>

                            <!-- 전체 에러 -->
                            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small mb-3">
                                <span th:errors="*{global}"></span>
                            </div>

                            <!-- 아이디 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">아이디 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{username}"
                                           th:class="'form-control' + (${#fields.hasErrors('username')} ? ' is-invalid' : '')"
                                           placeholder="4~20자 영문/숫자">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                         th:errors="*{username}"></div>
                                </div>
                            </div>

                            <!-- 이메일 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">이메일 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" th:field="*{email}"
                                           th:class="'form-control' + (${#fields.hasErrors('email')} ? ' is-invalid' : '')"
                                           placeholder="이메일 주소">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}"></div>
                                </div>
                            </div>

                            <!-- 비밀번호 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">비밀번호 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" th:field="*{password}"
                                           th:class="'form-control' + (${#fields.hasErrors('password')} ? ' is-invalid' : '')"
                                           placeholder="6자 이상">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}"></div>
                                </div>
                            </div>

                            <!-- 비밀번호 확인 -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">비밀번호 확인 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" th:field="*{passwordConfirm}"
                                           th:class="'form-control' + (${#fields.hasErrors('passwordConfirm')} ? ' is-invalid' : '')"
                                           placeholder="비밀번호 재입력">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordConfirm')}"
                                         th:errors="*{passwordConfirm}"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-person-plus me-2"></i>회원가입
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <span class="text-muted">이미 계정이 있으신가요?</span>
                    <a th:href="@{/auth/login}" class="text-primary fw-semibold ms-1">로그인</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
