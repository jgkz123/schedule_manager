<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${schedule.title} + ' - 일정 관리 시스템'">일정 상세</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/header :: alerts}"></div>

    <!-- 뒤로가기 -->
    <div class="mb-4">
        <a th:href="@{/schedules}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>목록으로
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-4 px-4">
                    <!-- 배지 -->
                    <div class="d-flex gap-2 mb-3">
                        <span th:class="'badge fs-6 status-' + ${schedule.status.name().toLowerCase()}"
                              th:text="${schedule.status.label}"></span>
                        <span th:class="'badge fs-6 priority-' + ${schedule.priority.name().toLowerCase()}"
                              th:text="${schedule.priority.label}"></span>
                        <span th:if="${schedule.overdue}" class="badge bg-danger fs-6">
                            <i class="bi bi-exclamation-triangle me-1"></i>마감 초과
                        </span>
                        <span th:if="${schedule.dueSoon and !schedule.overdue}" class="badge bg-warning text-dark fs-6">
                            <i class="bi bi-alarm me-1"></i>마감 임박
                        </span>
                    </div>
                    <!-- 제목 -->
                    <h3 class="fw-bold mb-0" th:text="${schedule.title}">제목</h3>
                </div>

                <div class="card-body px-4 py-4">
                    <!-- 기간 정보 -->
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6" th:if="${schedule.startDate != null}">
                            <div class="p-3 bg-light rounded">
                                <div class="text-muted small mb-1"><i class="bi bi-calendar-plus me-1"></i>시작일</div>
                                <div class="fw-semibold" th:text="${#temporals.format(schedule.startDate, 'yyyy년 MM월 dd일')}"></div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div th:class="'p-3 rounded ' + (${schedule.overdue} ? 'bg-danger bg-opacity-10' : 'bg-light')">
                                <div th:class="'small mb-1 ' + (${schedule.overdue} ? 'text-danger' : 'text-muted')">
                                    <i class="bi bi-calendar-x me-1"></i>마감일
                                </div>
                                <div th:class="'fw-semibold ' + (${schedule.overdue} ? 'text-danger' : '')"
                                     th:text="${#temporals.format(schedule.dueDate, 'yyyy년 MM월 dd일')}"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 내용 -->
                    <div th:if="${schedule.description != null and !schedule.description.isBlank()}">
                        <h6 class="fw-bold text-muted mb-2">
                            <i class="bi bi-file-text me-1"></i>내용
                        </h6>
                        <div class="p-3 bg-light rounded" style="white-space: pre-wrap;"
                             th:text="${schedule.description}"></div>
                    </div>
                    <div th:if="${schedule.description == null or schedule.description.isBlank()}"
                         class="text-muted text-center py-3">
                        <i class="bi bi-file-earmark me-1"></i>내용이 없습니다.
                    </div>

                    <!-- 등록/수정 시간 -->
                    <div class="mt-4 pt-3 border-top text-muted small">
                        <i class="bi bi-clock me-1"></i>
                        등록: <span th:text="${#temporals.format(schedule.createdAt, 'yyyy. MM. dd HH:mm')}"></span>
                        <span th:if="${schedule.updatedAt != null}" class="ms-3">
                            수정: <span th:text="${#temporals.format(schedule.updatedAt, 'yyyy. MM. dd HH:mm')}"></span>
                        </span>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="card-footer bg-white py-3 px-4">
                    <div class="d-flex gap-2">
                        <a th:href="@{/schedules/{id}/edit(id=${schedule.id})}"
                           class="btn btn-primary flex-grow-1">
                            <i class="bi bi-pencil-square me-1"></i>수정
                        </a>
                        <button type="button" class="btn btn-outline-danger px-4"
                                data-bs-toggle="modal" data-bs-target="#deleteModal">
                            <i class="bi bi-trash me-1"></i>삭제
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold text-danger">
                    <i class="bi bi-exclamation-triangle me-2"></i>일정 삭제
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-1">다음 일정을 삭제하시겠습니까?</p>
                <p class="fw-bold" th:text="'「' + ${schedule.title} + '」'"></p>
                <small class="text-muted">삭제된 일정은 복구할 수 없습니다.</small>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <form th:action="@{/schedules/{id}/delete(id=${schedule.id})}" method="post">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>삭제 확인
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
