<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - 일정 관리 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/header :: alerts}"></div>

    <!-- 페이지 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">안녕하세요, <span th:text="${username}" class="text-primary"></span>님!</h2>
            <p class="text-muted mb-0">오늘의 일정을 확인하세요.</p>
        </div>
        <a th:href="@{/schedules/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>새 일정 등록
        </a>
    </div>

    <!-- 통계 카드 -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-warning bg-opacity-10 p-3 me-3">
                        <i class="bi bi-hourglass-split text-warning fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">대기중</div>
                        <div class="fs-3 fw-bold" th:text="${pendingCount}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-primary bg-opacity-10 p-3 me-3">
                        <i class="bi bi-arrow-repeat text-primary fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">진행중</div>
                        <div class="fs-3 fw-bold" th:text="${inProgressCount}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-success bg-opacity-10 p-3 me-3">
                        <i class="bi bi-check-circle text-success fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">완료</div>
                        <div class="fs-3 fw-bold" th:text="${completedCount}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-danger bg-opacity-10 p-3 me-3">
                        <i class="bi bi-bell text-danger fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">읽지 않은 알림</div>
                        <div class="fs-3 fw-bold" th:text="${unreadCount}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- 마감 임박 일정 -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-alarm text-warning me-2"></i>마감 임박 (3일 이내)
                        <span class="badge bg-warning text-dark ms-2" th:text="${upcomingSchedules.size()}">0</span>
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(upcomingSchedules)}" class="text-center text-muted py-4">
                        <i class="bi bi-check-all fs-3 d-block mb-2"></i>
                        마감 임박 일정이 없습니다.
                    </div>
                    <ul class="list-group list-group-flush">
                        <li th:each="s : ${upcomingSchedules}"
                            class="list-group-item list-group-item-action px-4 py-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <a th:href="@{/schedules/{id}(id=${s.id})}"
                                       class="fw-semibold text-decoration-none text-dark"
                                       th:text="${s.title}">제목</a>
                                    <div class="small text-muted mt-1">
                                        <i class="bi bi-calendar3 me-1"></i>
                                        <span th:text="${#temporals.format(s.dueDate, 'yyyy년 MM월 dd일')}"></span>
                                    </div>
                                </div>
                                <span th:class="'badge ms-2 priority-' + ${s.priority.name().toLowerCase()}"
                                      th:text="${s.priority.label}"></span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 마감 초과 일정 -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-exclamation-triangle text-danger me-2"></i>마감 초과
                        <span class="badge bg-danger ms-2" th:text="${overdueSchedules.size()}">0</span>
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(overdueSchedules)}" class="text-center text-muted py-4">
                        <i class="bi bi-check-all fs-3 d-block mb-2"></i>
                        마감 초과 일정이 없습니다.
                    </div>
                    <ul class="list-group list-group-flush">
                        <li th:each="s : ${overdueSchedules}"
                            class="list-group-item list-group-item-action px-4 py-3 list-group-item-danger">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <a th:href="@{/schedules/{id}(id=${s.id})}"
                                       class="fw-semibold text-decoration-none text-dark"
                                       th:text="${s.title}">제목</a>
                                    <div class="small text-danger mt-1">
                                        <i class="bi bi-calendar-x me-1"></i>
                                        <span th:text="${#temporals.format(s.dueDate, 'yyyy년 MM월 dd일')}"></span> 초과
                                    </div>
                                </div>
                                <a th:href="@{/schedules/{id}/edit(id=${s.id})}"
                                   class="btn btn-sm btn-outline-danger">수정</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 최근 알림 -->
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-bell text-primary me-2"></i>최근 알림
                    </h5>
                    <a th:href="@{/notifications}" class="btn btn-sm btn-outline-primary">전체 보기</a>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(unreadNotifications)}" class="text-center text-muted py-4">
                        <i class="bi bi-bell-slash fs-3 d-block mb-2"></i>
                        새로운 알림이 없습니다.
                    </div>
                    <ul class="list-group list-group-flush">
                        <li th:each="n, stat : ${unreadNotifications}" th:if="${stat.index < 5}"
                            class="list-group-item px-4 py-3">
                            <div class="d-flex align-items-start">
                                <i th:class="'bi me-3 mt-1 fs-5 ' + (${n.type.name() == 'OVERDUE'} ? 'bi-exclamation-circle text-danger' : 'bi-alarm text-warning')"></i>
                                <div class="flex-grow-1">
                                    <div th:text="${n.message}" class="mb-1"></div>
                                    <small class="text-muted" th:text="${#temporals.format(n.notifiedAt, 'MM월 dd일 HH:mm')}"></small>
                                </div>
                                <form th:action="@{/notifications/{id}/read(id=${n.id})}" method="post" class="ms-2">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary">확인</button>
                                </form>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
