<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? '일정 수정' : '일정 등록'" >일정 - 일정 관리 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <!-- 페이지 헤더 -->
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/schedules}" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h2 class="fw-bold mb-0" th:text="${isEdit} ? '일정 수정' : '새 일정 등록'"></h2>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${isEdit} ? @{/schedules/{id}/edit(id=${scheduleId})} : @{/schedules/new}"
                          th:object="${scheduleDto}" method="post" novalidate>

                        <!-- 제목 -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                제목 <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{title}"
                                   th:class="'form-control' + (${#fields.hasErrors('title')} ? ' is-invalid' : '')"
                                   placeholder="일정 제목을 입력하세요">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}"></div>
                        </div>

                        <!-- 내용 -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">내용</label>
                            <textarea th:field="*{description}"
                                      th:class="'form-control' + (${#fields.hasErrors('description')} ? ' is-invalid' : '')"
                                      rows="4" placeholder="일정에 대한 세부 내용을 입력하세요"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}"></div>
                        </div>

                        <div class="row g-3">
                            <!-- 시작일 -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">시작일</label>
                                <input type="date" th:field="*{startDate}" class="form-control">
                            </div>

                            <!-- 마감일 -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    마감일 <span class="text-danger">*</span>
                                </label>
                                <input type="date" th:field="*{dueDate}"
                                       th:class="'form-control' + (${#fields.hasErrors('dueDate')} ? ' is-invalid' : '')">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}"
                                     th:errors="*{dueDate}"></div>
                            </div>

                            <!-- 우선순위 -->
                            <div th:class="${isEdit} ? 'col-md-6' : 'col-12'">
                                <label class="form-label fw-semibold">우선순위 <span class="text-danger">*</span></label>
                                <select th:field="*{priority}" class="form-select">
                                    <option th:each="p : ${priorities}"
                                            th:value="${p.name()}"
                                            th:text="${p.label}"></option>
                                </select>
                            </div>

                            <!-- 상태 (수정 시에만 표시) -->
                            <div class="col-md-6" th:if="${isEdit}">
                                <label class="form-label fw-semibold">상태</label>
                                <select th:field="*{status}" class="form-select">
                                    <option th:each="s : ${statuses}"
                                            th:value="${s.name()}"
                                            th:text="${s.label}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- 버튼 -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary flex-grow-1 py-2 fw-semibold">
                                <i th:class="'bi me-2 ' + (${isEdit} ? 'bi-pencil-square' : 'bi-plus-circle')"></i>
                                <span th:text="${isEdit} ? '수정하기' : '등록하기'"></span>
                            </button>
                            <a th:href="@{/schedules}" class="btn btn-outline-secondary px-4">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
